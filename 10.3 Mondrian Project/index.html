<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* grid-template-areas */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      place-content: center;
    }

    .container {
      width: 748px;
      height: 748px;
      background: #000;
      display: grid;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      grid-template-areas:
        "rouge  blanc1 blanc1 blanc1"
        "blanc2 blanc3 blanc3 bleu"
        "blanc2 blanc3 blanc3 blanc4"
        "blanc5 jaune  noir   blanc4";
    }

    
    .zone-rouge  { grid-area: rouge;  background-color: #E72F24; }
    .zone-blanc1 { grid-area: blanc1; background-color: #F0F1EC; }
    .zone-blanc2 { grid-area: blanc2; background-color: #F0F1EC; }
    .zone-blanc3 { grid-area: blanc3; background-color: #F0F1EC; }
    .zone-blanc4 { grid-area: blanc4; background-color: #F0F1EC; }
    .zone-blanc5 { grid-area: blanc5; background-color: #F0F1EC; }
    .zone-bleu   { grid-area: bleu;   background-color: #004592; box-shadow: inset 0 -10px 0 #000; }
    .zone-jaune  { grid-area: jaune;  background-color: #F9D01E; }
    .zone-noir   { grid-area: noir;   background-color: #232629; }
  </style>
</head>

<body>
  <div class="container">
    <div class="zone-rouge"></div>
    <div class="zone-blanc1"></div>
    <div class="zone-blanc2"></div>
    <div class="zone-blanc3"></div>
    <div class="zone-bleu"></div>
    <div class="zone-blanc4"></div>
    <div class="zone-blanc5"></div>
    <div class="zone-jaune"></div>
    <div class="zone-noir"></div>
  </div>
</body>

</html>
